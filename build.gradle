plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
    id("com.gradleup.shadow") version "9.3.0"
}

group = 'org.nakii'
version = '1.0.0-beta1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "okaeri-repo"
        url = "https://storehouse.okaeri.eu/repository/maven-public/"
    }
    maven {
        name = "codemc-repo"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    implementation("com.zaxxer:HikariCP:5.1.0")
    implementation("org.xerial:sqlite-jdbc:3.46.0.0")
    implementation("com.mysql:mysql-connector-j:8.3.0")
    implementation("com.google.code.gson:gson:2.10.1")
    compileOnly("com.github.retrooper:packetevents-spigot:2.12.0")
    // Tests run against the 26.2 API on purpose: MockBukkit has no v26.2 artifact yet, and its
    // bundled registry data must match the API version (26.2 data + 26.2 API fails with "Null JSON
    // element while retrieving `minecraft:decorated_pot_pattern`"). Bump both together once a
    // mockbukkit-v26.2 is published.
    testImplementation("io.papermc.paper:paper-api:26.2.build.+")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation('org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.116.1')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    // Java 22+ (JEP 472) warns — and a future release will refuse — when a library in the unnamed
    // module loads native code without this; sqlite-jdbc does so via System.load.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Byte Buddy (under Mockito/MockBukkit) still uses sun.misc.Unsafe memory access, which JDK 24+
    // (JEP 498) warns about on first use.
    jvmArgs '--sun-misc-unsafe-memory-access=allow'
    // Mockito's inline mock maker appends to the bootstrap class path, which disables class data
    // sharing for app classes and makes the JVM print a notice per test fork; turn CDS off up front.
    jvmArgs '-Xshare:off'
}

test {
    // MockBukkit boots a mock server and is sensitive to Bukkit static state left behind by
    // other tests sharing the JVM, so it runs in its own isolated task (see 'testMock').
    useJUnitPlatform { excludeTags 'mockbukkit' }
}

tasks.register('testMock', Test) {
    // NOTE: custom Test tasks registered via tasks.register(..., Test) do NOT automatically
    // inherit the `test` source set's classpath the way the conventional `test` task does — this
    // was previously missing, which made this task silently discover and run zero tests
    // (reported as "NO-SOURCE") despite MockBukkit tests existing in the codebase.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mockbukkit' }
    forkEvery = 1 // fresh JVM per class — avoids cross-test Bukkit static pollution
    group = 'verification'
    description = 'Runs MockBukkit-based server tests in an isolated JVM.'
}

tasks.named('check') { dependsOn('testMock') }

tasks.register('testUnit', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'unit', 'config', 'database' }
    group = 'verification'
    description = 'Runs pure unit tests, YAML config validation, and DB tests (no Bukkit server needed).'
}

tasks.register('testFull', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'unit', 'scripting', 'recipe', 'skill', 'alchemy', 'config', 'integration', 'database' }
    dependsOn('testMock') // MockBukkit tests run in their own isolated JVM
    group = 'verification'
    description = 'Runs the full automated test suite (all tags except live-server tests).'
}

tasks.register('syncResources') {
    doLast {
        def srcDir = file('src/main/resources')
        def dstDir = file('run/plugins/Valmora')
        if (!dstDir.exists()) return

        // Fully replace each subdirectory so deleted files are removed from the run folder
        srcDir.listFiles({ it.isDirectory() } as FileFilter)?.each { srcSub ->
            def dstSub = new File(dstDir, srcSub.name)
            if (dstSub.exists()) dstSub.deleteDir()
            copy { from srcSub; into dstSub }
        }

        // Copy top-level config files (skip plugin.yml — it is the plugin descriptor)
        srcDir.listFiles({ it.isFile() && it.name != 'plugin.yml' } as FileFilter)?.each { f ->
            copy { from f; into dstDir }
        }
    }
}

tasks {
    runServer {
        minecraftVersion("26.2")
        dependsOn('syncResources')
    }
    shadowJar {
        // Relocate libraries that the server (or other plugins) also ship, to avoid
        // classpath collisions. Gson is bundled by Paper; HikariCP is commonly shaded
        // by other plugins. The JDBC drivers (sqlite-jdbc, mysql-connector) are NOT
        // relocated: sqlite-jdbc loads a native library by resource path and its driver
        // class is referenced as a string in DatabaseFactory, both of which relocation
        // would break. They stay safe inside the isolated plugin classloader.
        relocate 'com.google.gson', 'org.nakii.valmora.lib.gson'
        relocate 'com.zaxxer.hikari', 'org.nakii.valmora.lib.hikari'
    }

    build {
        dependsOn(shadowJar)
    }
}

def targetJavaVersion = 25
java {
    // Always build against a Java 25 toolchain (class file major version 69), regardless of the
    // JDK running Gradle — Paper 26.x requires Java 25, and its plugin remapper (ASM) cannot read
    // class files newer than the Java version it was built for.
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
    // Surface deprecation/unchecked warnings instead of javac's one-line "Note:" summary.
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Xlint:rawtypes', '-Xlint:removal']
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Xlint:rawtypes', '-Xlint:removal']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
