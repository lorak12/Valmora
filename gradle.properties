# Gradle's bundled native-platform library calls System.load; JDK 24+ (JEP 472) warns about that on
# every build unless native access is granted to the daemon. The memory flags are Gradle's defaults,
# restated because setting org.gradle.jvmargs replaces them.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m --enable-native-access=ALL-UNNAMED
