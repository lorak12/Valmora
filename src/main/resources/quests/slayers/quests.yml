  # ---------------------------------------------------------- Spider Slayer
  spider_slayer_t1:
    name: "<dark_gray>Spider Slayer I"
    objectives:
      kill:
        type: KILL
        target: SPIDER
        amount: 5
        notify: 1
        events: "spawn_mob spider_slayer_boss_1"
      boss:
        type: KILL
        target: spider_slayer_boss_1
        amount: 1
        events: "spider_t1_reward"

  spider_slayer_t2:
    name: "<dark_gray>Spider Slayer II"
