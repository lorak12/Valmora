# =====================================================================
# Shardworks Recipes — Machine: crafting_table
# Ore -> ingot conversion, then ingots into tiered pickaxes/armor.
# =====================================================================

# ---------------------------------------------------------------------
# Ore refining
# ---------------------------------------------------------------------
ferrite_ingot_craft:
  machine: crafting_table
  type: SHAPELESS
  inputs:
    - { item: raw_ferrite, amount: 2 }
  outputs:
    result: { item: ferrite_ingot, amount: 1 }

lumicite_crystal_craft:
  machine: crafting_table
  type: SHAPELESS
  inputs:
    - { item: raw_lumicite, amount: 2 }
  outputs:
    result: { item: lumicite_crystal, amount: 1 }

aetherium_ingot_craft:
  machine: crafting_table
  type: SHAPELESS
  inputs:
    - { item: raw_aetherium, amount: 2 }
  outputs:
    result: { item: aetherium_ingot, amount: 1 }

# ---------------------------------------------------------------------
# Pickaxes
# ---------------------------------------------------------------------
ferrite_pickaxe_craft:
  machine: crafting_table
  type: SHAPED
  inputs:
    "0": { item: ferrite_ingot, amount: 1 }
    "1": { item: ferrite_ingot, amount: 1 }
    "2": { item: ferrite_ingot, amount: 1 }
    "4": { item: STICK, amount: 1 }
    "7": { item: STICK, amount: 1 }
  outputs:
    result: { item: ferrite_pickaxe, amount: 1 }

lumicite_pickaxe_craft:
  machine: crafting_table
  type: SHAPED
  inputs:
    "0": { item: lumicite_crystal, amount: 1 }
    "1": { item: lumicite_crystal, amount: 1 }
    "2": { item: lumicite_crystal, amount: 1 }
    "4": { item: STICK, amount: 1 }
    "7": { item: STICK, amount: 1 }
  outputs:
    result: { item: lumicite_pickaxe, amount: 1 }

aetherium_pickaxe_craft:
  machine: crafting_table
  type: SHAPED
  inputs:
    "0": { item: aetherium_ingot, amount: 1 }
    "1": { item: aetherium_ingot, amount: 1 }
    "2": { item: aetherium_ingot, amount: 1 }
    "4": { item: STICK, amount: 1 }
    "7": { item: STICK, amount: 1 }
  outputs:
    result: { item: aetherium_pickaxe, amount: 1 }

