# =====================================================================
# Valmora Alchemy Recipes
#
# Each recipe has two variants:
#   _bottle  — uses GLASS_BOTTLE (fresh empty bottle)
#   _potion  — uses POTION       (any base potion from creative/commands)
#
# The brew event picks the first matching recipe, so both routes produce
# the same output item.
# =====================================================================

# --- Awkward Potion (Nether Wart base) ---

awkward_potion_bottle:
  machine: alchemy
  type: SHAPELESS
  inputs:
    - item: NETHER_WART
      amount: 1
    - item: GLASS_BOTTLE
      amount: 1
  outputs:
    result:
      item: POTION
      amount: 1
  on-craft:
    - "sound player entity.witch.celebrate"
    - "variable add player.var.alchemy_xp 5"

awkward_potion_potion:
  machine: alchemy
  type: SHAPELESS
  inputs:
    - item: NETHER_WART
      amount: 1
    - item: POTION
      amount: 1
  outputs:
    result:
      item: POTION
      amount: 1
  on-craft:
    - "sound player entity.witch.celebrate"
    - "variable add player.var.alchemy_xp 5"

