# ─── Mining — Gem & Precious Ore Collections ──────────────────────────────────
# coal and iron_ingot are in coal.yml; this file covers other precious resources.

diamond:
  category: mining
  name: "<aqua>Diamond"
  icon: DIAMOND
  track:
    - "BLOCK_BREAK:DIAMOND_ORE"
    - "BLOCK_BREAK:DEEPSLATE_DIAMOND_ORE"
    - "ITEM_PICKUP:DIAMOND"
  stages:
    1:
      required: 10
      rewards:
        - "notify <gray>Diamond Miner title io:chat"
    2:
      required: 50
      rewards:
        - "notify <gray>+5% diamond ore yield io:chat"
    3:
      required: 250
      rewards:
        - "notify <gray>Gem Seeker title io:chat"
    4:
      required: 1000
      rewards:
        - "notify <gray>+10% diamond drop rate io:chat"
    5:
      required: 5000
      rewards:
        - "notify <gray>Diamond Baron title io:chat"
    6:
      required: 25000
      rewards:
        - "notify <gray>Diamond God title io:chat"
        - "notify <gray>Diamond Crown cosmetic io:chat"

