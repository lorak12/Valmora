# ─── Mining — Gem & Precious Ore Collections ──────────────────────────────────
# coal and iron_ingot are in coal.yml; this file covers other precious resources.

diamond:
  category: mining
  name: "<aqua>Diamond"
  icon: DIAMOND
  track:
    - "BLOCK_BREAK:DIAMOND_ORE"
    - "BLOCK_BREAK:DEEPSLATE_DIAMOND_ORE"
    - "ITEM_PICKUP:DIAMOND"
  stages:
    1:
      required: 10
      rewards:
        - "<gray>Diamond Miner title"
    2:
      required: 50
      rewards:
        - "<gray>+5% diamond ore yield"
    3:
      required: 250
      rewards:
        - "<gray>Gem Seeker title"
    4:
      required: 1000
      rewards:
        - "<gray>+10% diamond drop rate"
    5:
      required: 5000
      rewards:
        - "<gray>Diamond Baron title"
    6:
      required: 25000
      rewards:
        - "<gray>Diamond God title"
        - "<gray>Diamond Crown cosmetic"

