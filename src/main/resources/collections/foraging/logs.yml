# ─── Foraging — Wood Log Collections ──────────────────────────────────────────

spruce_log:
  category: foraging
  name: "<dark_gray>Spruce Log"
  icon: SPRUCE_LOG
  track:
    - "BLOCK_BREAK:SPRUCE_LOG"
    - "BLOCK_BREAK:STRIPPED_SPRUCE_LOG"
