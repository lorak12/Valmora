# ─── Foraging — Wood Log Collections ──────────────────────────────────────────

spruce_log:
  category: foraging
  name: "<dark_gray>Spruce Log"
  icon: SPRUCE_LOG
  track:
    - "BLOCK_BREAK:SPRUCE_LOG"
    - "BLOCK_BREAK:STRIPPED_SPRUCE_LOG"
    - "ITEM_PICKUP:SPRUCE_LOG"
  stages:
    1:
      required: 50
      rewards:
        - "notify <gray>Spruce Logger title io:chat"
    2:
      required: 250
      rewards:
        - "notify <gray>+5% spruce log yield io:chat"
    3:
      required: 1000
      rewards:
        - "notify <gray>Snow Lumberjack title io:chat"
    4:
      required: 5000
      rewards:
        - "notify <gray>+10% spruce wood drop io:chat"
    5:
      required: 25000
      rewards:
        - "notify <gray>Taiga Lord title io:chat"

