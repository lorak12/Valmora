# Wheat Collection
# track: list of "EVENT_TYPE:IDENTIFIER" strings.
# Supported event types: BLOCK_BREAK, MOB_KILL, FISHING, ITEM_PICKUP, CRAFT
# For custom Valmora items use: ITEM_PICKUP:custom:<item_id>

wheat:
  category: farming
  name: "<yellow>Wheat"
  icon: WHEAT
  track:
    - "BLOCK_BREAK:WHEAT"
    - "ITEM_PICKUP:WHEAT"
  stages:
    1:
      required: 50
      rewards:
        - "notify <gray>Beginner Farmer title io:chat"
    2:
      required: 250
      rewards:
        - "notify <gray>+1% crop harvest chance io:chat"
    3:
      required: 1000
      rewards:
        - "notify <gray>Access to Wheat Merchant io:chat"
    4:
      required: 5000
      rewards:
        - "notify <gray>+5% farming speed io:chat"
    5:
      required: 25000
      rewards:
        - "notify <gray>Master Farmer title io:chat"
        - "notify <gray>Wheat Crown cosmetic io:chat"
