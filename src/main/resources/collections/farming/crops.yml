# ─── Farming — Crop Collections ───────────────────────────────────────────────
# wheat and carrot are in their own files; this file covers all remaining crops.
# Track syntax: "EVENT_TYPE:MATERIAL"  where MATERIAL is the Bukkit enum name.

potato:
  category: farming
  name: "<yellow>Potato"
  icon: POTATO
  track:
    - "BLOCK_BREAK:POTATOES"
    - "ITEM_PICKUP:POTATO"
    - "ITEM_PICKUP:POISONOUS_POTATO"
  stages:
    1:
      required: 50
      rewards:
        - "<gray>Potato Peeler title"
