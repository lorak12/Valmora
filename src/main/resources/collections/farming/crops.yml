# ─── Farming — Crop Collections ───────────────────────────────────────────────
# wheat and carrot are in their own files; this file covers all remaining crops.
# Track syntax: "EVENT_TYPE:MATERIAL"  where MATERIAL is the Bukkit enum name.

potato:
  category: farming
  name: "<yellow>Potato"
  icon: POTATO
  track:
    - "BLOCK_BREAK:POTATOES"
    - "ITEM_PICKUP:POTATO"
    - "ITEM_PICKUP:POISONOUS_POTATO"
  stages:
    1:
      required: 50
      rewards:
        - "notify <gray>Potato Peeler title io:chat"
    2:
      required: 250
      rewards:
        - "notify <gray>+1 potato per harvest io:chat"
    3:
      required: 1000
      rewards:
        - "notify <gray>Potato Baker title io:chat"
    4:
      required: 5000
      rewards:
        - "notify <gray>+5% crop yield bonus io:chat"
    5:
      required: 25000
      rewards:
        - "notify <gray>Spud Lord title io:chat"

