# Migrated from the legacy resources/reforges/combat.yml (org.nakii.valmora.module.reforge,
# now removed) onto the generic modifier framework
# (docs/Valmora_Modifier_Framework_Design.docx). The "reforges" group uses
# tier-source: RARITY_RANK (modifiers/groups/reforges.yml) so tiers 1-7 below map 1:1 to
# the item's rarity rank (COMMON=1 .. DIVINE=7) at effect-resolution time — this reproduces
# the old stat-bonuses-by-rarity tables losslessly without a banned by-rarity map keyed by
# rarity NAME (see ModifierGroupDefinition/TierSource javadoc and the framework backlog doc).
# Each reforge's own `targets.item_types` narrows the group-level restriction further, exactly
# reproducing the old per-reforge `applicable-types:` list.

fierce:
  group: reforges
  display:
    name: "<red>Fierce"
    prefix: "<red>Fierce "
  targets:
    item_types: [SWORD, AXE]
  tiers:
    1: # COMMON
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 5
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 3
    2: # UNCOMMON
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 12
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 6
    3: # RARE
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 20
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 10
    4: # EPIC
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 32
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 15
    5: # LEGENDARY
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 48
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 22
    6: # MYTHIC
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 65
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 30
    7: # DIVINE
      effects:
        - type: STAT
          stat: strength
          operation: ADD
          value: 85
        - type: STAT
          stat: crit_damage
          operation: ADD
          value: 40

