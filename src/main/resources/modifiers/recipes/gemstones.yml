# Generic APPLY_MODIFIER/REMOVE_MODIFIER recipes for the custom_anvil machine
# (docs/Valmora_Modifier_Framework_Design.docx §16). Each recipe declares which base item types,
# addition item, and modifier/tier it grants — the ModifierEngine owns attachment semantics
# (capacity/exclusivity/conflicts); this file only declares intent + cost.

ruby_application_1:
  machine: custom_anvil
  operation: APPLY_MODIFIER
  base:
    item_types: [SWORD, AXE, BOW, HELMET, CHESTPLATE, LEGGINGS, BOOTS]
  addition:
    item: ruby_gem_1
    amount: 1
  modifier:
    group: gemstones
    id: ruby
    tier: 1
  cost:
    xp_levels: 2

