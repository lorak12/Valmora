# APPLY_MODIFIER/REMOVE_MODIFIER recipes for the migrated "reforges" group
# (docs/Valmora_Modifier_Framework_Design.docx §16), replacing the legacy reforge_anvil/
# forge_random DynamicMachineHandlers. Cost is rarity-scaled generically via each rarity's
# `forge_cost` property (rarities.yml) — see docs/MODIFIER_FRAMEWORK_BACKLOG.md.

fierce_reforge:
  machine: custom_anvil
  operation: APPLY_MODIFIER
  base:
    item_types: [SWORD, AXE]
  addition:
    item: fierce_reforge_stone
    amount: 1
  modifier:
    group: reforges
    id: fierce
  cost:
    coins:
      base: 1
      scaling: { type: RARITY, property: forge_cost, operation: MULTIPLY }

