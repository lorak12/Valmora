random_reforge:
  machine: custom_anvil
  operation: APPLY_MODIFIER
  base:
    item_types: [AXE, BOOTS, BOW, CHESTPLATE, CROSSBOW, HELMET, LEGGINGS, SWORD]
  # No `addition:` — matches with the base item alone, like the legacy forge_random.
  modifier:
    group: reforges
    id: RANDOM
  cost:
    coins:
      base: 1
      scaling: { type: RARITY, property: forge_cost, operation: MULTIPLY }

# No REMOVE_MODIFIER recipe here on purpose: with `random_reforge` matching on the base item alone
# (no addition needed) and appearing first in iteration order, a removal recipe would never be
# reachable through the anvil for an already-reforged item — matching the legacy system, which also
# had no in-GUI removal (only the admin `/reforge reset`, now `/modifier remove reforges`).
