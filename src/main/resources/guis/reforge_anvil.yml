# =====================================================================
# Valmora Reforge Anvil GUI  — 36 slots (4×9)
#
# Layout:
#  B = Black glass border
#  G = Grey glass filler
#  I = Input slot 1 (item to reforge)
#  A = Arrow display
#  O = Output slot  (reforged result)
#  R = Input slot 2 (reforge stone)
#  C = Apply button (triggers reforge_anvil machine)
# =====================================================================

reforge_anvil:
  title: "<dark_gray>⚒ Reforge Anvil"
  rows: 4
  machine: reforge_anvil

  layout:
    - "BBBBBBBBB"
    - "BGGGGGGGB"
    - "BGIAOGRGB"
    - "BBBBCBBBB"

  components:
    B:
      type: DISPLAY
      display-item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
        amount: 1

    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
        amount: 1

    I:
      type: INPUT
      id: base_item

    A:
      type: DISPLAY
      display-item:
        material: ARROW
        name: "<yellow>→"
        amount: 1

    O:
      type: OUTPUT
      id: result

    R:
      type: INPUT
      id: reforge_stone

    C:
      type: DISPLAY
      display-item:
        material: ANVIL
        name: "<green><bold>⚒ Apply Reforge!"
        lore:
          - "<gray>Place your item in the <white>left slot</gray>."
          - "<gray>Place a <aqua>Reforge Stone</aqua> in the <white>right slot</gray>."
          - "<gray>The reforge on the stone will"
          - "<gray>be directly applied to your item."
          - ""
          - "<gray>Cost by item rarity:"
          - "<white>  Common       <yellow>$reforge.cost.common$ Coins"
          - "<green>  Uncommon     <yellow>$reforge.cost.uncommon$ Coins"
          - "<blue>  Rare         <yellow>$reforge.cost.rare$ Coins"
          - "<dark_purple>  Epic         <yellow>$reforge.cost.epic$ Coins"
          - "<gold>  Legendary    <yellow>$reforge.cost.legendary$ Coins"
          - "<light_purple>  Mythic       <yellow>$reforge.cost.mythic$ Coins"
          - "<aqua>  Divine       <yellow>$reforge.cost.divine$ Coins"
        amount: 1
      actions:
        LEFT:
          actions:
            - "gui_force_craft"
        RIGHT:
          actions:
            - "gui_force_craft"

  on-open:
    actions:
      - "sound player block.anvil.use"
  on-close: {}
