# =====================================================================
# Valmora Anvil GUI  - 54 slots (6x9)
#
# Layout:
#  B = Black glass border
#  G = Grey glass filler
#  I = Base item input
#  M = Material input
#  O = Output slot
#  A = Anvil info button
# =====================================================================

anvil:
  title: "<dark_gray><bold>⚙ Valmora Anvil</bold></dark_gray>"
  rows: 6
  machine: anvil
  update-interval: 0

  layout:
    - "BBBBBBBBB"
    - "BGGGGGGGB"
    - "BGIBMBOGB"
    - "BGGGAGGGB"
    - "BGGGGGGGB"
    - "BBBBBBBBB"

  components:
    B:
      type: DISPLAY
      display-item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
        amount: 1

    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
        amount: 1

    I:
      type: INPUT
      id: base

    M:
      type: INPUT
      id: material

    O:
      type: OUTPUT
      id: result

    A:
      type: DISPLAY
      display-item:
        material: ANVIL
        name: "<gold><bold>⚙ Anvil Guide</bold></gold>"
        lore:
          - "<gray>Place your <yellow>item</yellow> in the left slot."
          - "<gray>Place a <aqua>sacrifice/material</aqua> in the middle slot."
          - ""
          - "<gray>Handles enchant merging, item+item merges,"
          - "<gray>repairs, reforge/gemstone application, and"
          - "<gray>tiered item upgrades — whichever matches."
          - ""
          - "<gray>Collect the result from the"
          - "<gray><green>right output slot</green>."
          - ""
          - "<dark_gray>Recipes are defined server-side."
        amount: 1

  on-open:
    actions:
      - "sound player block.anvil.place"
  on-slot-update:
    actions:
      - "sound player block.note_block.hat"
  on-close: {}
