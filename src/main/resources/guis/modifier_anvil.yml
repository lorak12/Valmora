# =====================================================================
# Valmora Modifier Anvil GUI — 36 slots (4×9)
#
# Generic front-end for the custom_anvil machine (docs/Valmora_Modifier_Framework_Design.docx §16) —
# replaces the legacy reforge_anvil/forge_random GUIs as well as the gemstone STAT_MODIFIER path.
# Whichever modifiers/recipes/*.yml entry matches the two input slots wins: an exact reforge/
# gemstone/trait application (addition item present), a random reroll (addition slot left empty,
# e.g. reforges' `random_reforge`), or a removal (only for groups that ship a REMOVE_MODIFIER
# recipe, e.g. gemstones' `remove_gemstone`).
#
# Layout:
#  B = Black glass border
#  G = Grey glass filler
#  I = Input slot 1 (item to modify)
#  A = Arrow display
#  O = Output slot (result)
#  M = Input slot 2 (reforge stone / gemstone / trait item — optional, recipe-dependent)
#  C = Apply button (triggers custom_anvil machine)
# =====================================================================

modifier_anvil:
  title: "<dark_gray>⚒ Modifier Anvil"
  rows: 4
  machine: custom_anvil

  layout:
    - "BBBBBBBBB"
    - "BGGGGGGGB"
    - "BGIAOGMGB"
    - "BBBBCBBBB"

  components:
    B:
      type: DISPLAY
      display-item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
        amount: 1

    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
        amount: 1

    I:
      type: INPUT
      id: base_item

    A:
      type: DISPLAY
      display-item:
        material: ARROW
        name: "<yellow>→"
        amount: 1

    O:
      type: OUTPUT
      id: result

    M:
      type: INPUT
      id: addition_item

    C:
      type: DISPLAY
      display-item:
        material: ANVIL
        name: "<green><bold>⚒ Apply!"
        lore:
          - "<gray>Place your item in the <white>left slot</gray>."
          - "<gray>Place a reforge stone / gemstone / trait item"
          - "<gray>in the <white>right slot</gray> to attach it."
          - "<gray>Some recipes work with the right slot"
          - "<gray>empty instead (e.g. a random reforge reroll)."
        amount: 1
      actions:
        LEFT:
          actions:
            - "gui_force_craft"
        RIGHT:
          actions:
            - "gui_force_craft"

  on-open:
    actions:
      - "sound player block.anvil.use"
  on-close: {}
