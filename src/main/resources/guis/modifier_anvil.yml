# =====================================================================
# Valmora Modifier Anvil GUI — 36 slots (4×9)
#
# Generic front-end for the custom_anvil machine (docs/Valmora_Modifier_Framework_Design.docx §16):
# APPLY_MODIFIER when a gemstone/trait item is placed in the addition slot, REMOVE_MODIFIER when
# only the base item is present and it already carries a modifier from the requested group.
#
# Layout:
#  B = Black glass border
#  G = Grey glass filler
#  I = Input slot 1 (item to modify)
#  A = Arrow display
#  O = Output slot (result)
#  M = Input slot 2 (gemstone/trait item — optional for removal)
#  C = Apply button (triggers custom_anvil machine)
# =====================================================================

modifier_anvil:
  title: "<dark_gray>⚒ Modifier Anvil"
  rows: 4
  machine: custom_anvil

  layout:
    - "BBBBBBBBB"
    - "BGGGGGGGB"
    - "BGIAOGMGB"
    - "BBBBCBBBB"

  components:
    B:
      type: DISPLAY
      display-item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
        amount: 1

    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
        amount: 1

    I:
      type: INPUT
      id: base_item

    A:
      type: DISPLAY
      display-item:
        material: ARROW
        name: "<yellow>→"
        amount: 1

    O:
      type: OUTPUT
      id: result

    M:
      type: INPUT
      id: addition_item

    C:
      type: DISPLAY
      display-item:
        material: ANVIL
        name: "<green><bold>⚒ Apply!"
        lore:
          - "<gray>Place your item in the <white>left slot</gray>."
          - "<gray>Place a gemstone/trait item in the"
          - "<gray><white>right slot</gray> to attach it."
          - "<gray>Leave the right slot empty to remove"
          - "<gray>an existing modifier of that kind instead."
        amount: 1
      actions:
        LEFT:
          actions:
            - "gui_force_craft"
        RIGHT:
          actions:
            - "gui_force_craft"

  on-open:
    actions:
      - "sound player block.anvil.use"
  on-close: {}
