alchemy_table:
  title: "<light_purple>⚗ Alchemy Table</light_purple>"
  rows: 6
  machine: alchemy
  update-interval: 20

  layout:
    - "BBBBBBBBB"
    - "BBBBIBBBB"
    - "BBTTTTTBB"
    - "BBTBTBTBB"
    - "BBPBPBPBB"
    - "BBBBCBBBB"

  # Slot legend:
  #   B = Purple glass border
  #   I = Ingredient INPUT (consumed immediately when brew starts)
  #   T = Status / instruction DISPLAY (updates every tick via props)
  #   P = Bottle INPUT slots — locked during brew, replaced with result after
  #   C = Close button

  components:
    B:
      type: DISPLAY
      display-item:
        material: PURPLE_STAINED_GLASS_PANE
        name: " "

    I:
      type: INPUT
      id: ingredient

    T:
      type: DISPLAY
      display-item:
        material: BREWING_STAND
        name: "<light_purple><bold>⚗ Alchemy Table</bold></light_purple>"
        lore:
          - ""
          - "<gray>Status: $prop.brew_status$"
          - "<gray>Time remaining: <white>$prop.brew_time$<gray>s"
          - ""
          - "<dark_gray>• Place a base potion in the bottom slots"
          - "<dark_gray>• Place an ingredient in the top slot"
          - "<dark_gray>• Wait for the brew timer to reach zero"

    P:
      type: INPUT
      id: bottle

    C:
      type: DISPLAY
      display-item:
        material: BARRIER
        name: "<red>Close"
      actions:
        LEFT:
          actions:
            - "close"

  on-open:
    actions:
      - "variable set prop.brew_time 0"
      - "variable set prop.brew_status <gray>Waiting..."
      - "variable set prop.brew_running 0"
      - "sound player block.brewing_stand.brew"

  on-slot-update:
    actions:
      # If a brew is active, ignore all slot changes — the ingredient is already
      # consumed and the bottles are locked. Nothing to reset here.
      - "condition $prop.brew_running$ == 0"
      # If nothing useful is present any more, show Waiting status.
      - "condition $gui.input.bottle.count$ == 0"
      - "variable set prop.brew_time 0"
      - "variable set prop.brew_status <gray>Waiting..."

  on-update:
    actions:
      # Primary path: brew is running — tick the timer down.
      - "condition $prop.brew_running$ > 0"
      - "variable add prop.brew_time -1"
      - "condition $prop.brew_time$ == 0"
      - "gui_alchemy_brew"
      - "variable set prop.brew_status <green>Done!"
      - "variable set prop.brew_running 0"
      - "sound player block.brewing_stand.brew"
    fail-actions:
      # Not currently running. Start a brew if ingredient + bottles are present
      # and the recipe is valid. gui_alchemy_start consumes the ingredient and
      # stores the result; it aborts the chain (ConditionAbortException) if no
      # recipe matches, so brew_time/brew_running are only set on success.
      # The brew_running == 0 guard MUST be first — without it this block would
      # also fire every tick when condition 3 (brew_time == 0) fails during a
      # normal countdown, since fail-actions are also entered from that path.
      - "condition $prop.brew_running$ == 0"
      - "condition $gui.input.ingredient.material$ != null"
      - "condition $gui.input.bottle.count$ > 0"
      - "gui_alchemy_start"
      - "variable set prop.brew_time 10"
      - "variable set prop.brew_status <yellow>Brewing..."
      - "variable set prop.brew_running 1"
