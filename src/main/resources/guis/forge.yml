# =====================================================================
# Valmora Forge GUI  - 36 slots (4x9)
#
# Layout:
#  B = Black glass border
#  G = Grey glass filler
#  I = Input slot 1 (base item)
#  M = Input slot 2 (material)
#  O = Output slot (result)
#  F = Forge info button
# =====================================================================

forge:
  title: "<dark_red><bold>⚒ Valmora Forge</bold></dark_red>"
  rows: 4
  machine: forge
  update-interval: 0

  layout:
    - "BBBBBBBBB"
    - "BGGGGGGGB"
    - "BGIBMBOGB"
    - "BBBBFBBBB"

  components:
    B:
      type: DISPLAY
      display-item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
        amount: 1

    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
        amount: 1

    I:
      type: INPUT
      id: input1

    M:
      type: INPUT
      id: input2

    O:
      type: OUTPUT
      id: result

    F:
      type: DISPLAY
      display-item:
        material: BLAST_FURNACE
        name: "<red><bold>⚒ Forge Guide</bold></red>"
        lore:
          - "<gray>Place your <yellow>base item</yellow>"
          - "<gray>in the left input slot."
          - ""
          - "<gray>Place the <aqua>material</aqua>"
          - "<gray>in the middle slot."
          - ""
          - "<gray>Collect the result from the"
          - "<gray><green>right output slot</green>."
          - ""
          - "<dark_gray>Forge-specific recipes only."
        amount: 1

  on-open:
    actions:
      - "sound player block.blast_furnace.crack"
  on-slot-update:
    actions:
      # NOTE: no gui_force_craft here on purpose. GuiListener.triggerSlotUpdate already re-previews
      # the OUTPUT slot on every input change regardless of this block's contents (updateRecipeOutput
      # runs unconditionally before these actions) — wiring gui_force_craft here would REALLY craft
      # (consume + build) the instant ingredients match, with no way to back out, and would leave the
      # output slot un-collectible by the normal click-to-take handler once the inputs it needs are
      # already gone. Same click-to-collect pattern as the crafting table/anvil: the preview updates
      # live, the actual craft only happens when the player clicks the OUTPUT slot.
      - "sound player block.anvil.land"
  on-close: {}
