reforge:
  title: "<dark_gray>⚒ Reforge Station"
  rows: 3
  machine: reforge

  layout:
    - "GGGGGGGGG"
    - "GGIAOARGG"
    - "GGGGCGGGG"

  components:
    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "

    I:
      type: INPUT
      id: base_item

    R:
      type: INPUT
      id: reforge_stone

    O:
      type: OUTPUT
      id: result

    A:
      type: DISPLAY
      display-item:
        material: ARROW
        name: "<yellow>→"

    C:
      type: DISPLAY
      display-item:
        material: ANVIL
        name: "<green><bold>⚒ Reforge!"
        lore:
          - "<gray>Click to apply the reforge."
          - "<dark_gray>Cost depends on the reforge."
      actions:
        LEFT:
          actions:
            - "gui_force_craft"
        RIGHT:
          actions:
            - "gui_force_craft"

  on-open:
    actions:
      - "sound player block.anvil.use"
  on-close: {}
