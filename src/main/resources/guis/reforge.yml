# =====================================================================
# Valmora Reforge GUI  — 45 slots (5×9)
#
# Layout:
#  R = Red glass border (columns 1 and 9)
#  G = Grey glass filler
#  I = Input slot  (item to reforge)
#  O = Output slot (reforged result)
#  C = Reforge button (triggers forge_random machine)
# =====================================================================

reforge:
  title: "<dark_red><bold>⚒ Reforge Item</bold></dark_red>"
  rows: 5
  machine: forge_random
  update-interval: 0

  layout:
    - "RGGGGGGGR"
    - "RGGGIGGGR"
    - "RGGGCGGGR"
    - "RGGGGGGGR"
    - "RGGGXGGGR"

  components:
    R:
      type: DISPLAY
      display-item:
        material: RED_STAINED_GLASS_PANE
        name: " "
        amount: 1

    G:
      type: DISPLAY
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
        amount: 1

    I:
      type: INPUT
      id: base_item

    X:
      type: DISPLAY
      display-item:
        material: BARRIER
        name: "<red>Close"
        amount: 1
      actions:
        LEFT:
          actions:
            - "close"
        RIGHT:
          actions:
            - "close"

    C:
      type: DISPLAY
      display-item:
        material: ANVIL
        name: "<yellow>Reforge Item"
        lore:
          - "<gray>Place an item above to reforge"
          - "<gray>it! Reforging items adds a"
          - "<gray>random modifier to the item that"
          - "<gray>grants stat boosts."
        amount: 1
      actions:
        LEFT:
          actions:
            - "gui_force_craft"
        RIGHT:
          actions:
            - "gui_force_craft"

  on-open:
    actions:
      - "sound player block.blast_furnace.crack"
  on-close: {}
