# =====================================================================
# Slayer menu — activates quests/slayers tier quests. Same GUI engine as
# guis/geomancy_tree.yml (per-component `states:` conditions).
#
# Each tier button has two states:
#   available   — not currently in progress (never started, or a prior run completed).
#                 Clicking checks the coin cost, charges it, then re-arms the quest via
#                 quest_cancel + quest_start (safe/idempotent even on a first run — see
#                 resources/quests/slayers/quests.yml).
#   in_progress — shows live kill/boss progress via the quest module's own variables.
# =====================================================================

slayers:
  title: "<dark_purple>Slayer Quests</dark_purple>"
  rows: 6
  update-interval: 20

  # Shared cost table (added 2026-08-07) — each tier's coin cost is set exactly once here and
  # referenced everywhere else (lore, purse-check condition, economy_remove amount, fail message)
  # via $prop.cost_<n>$, instead of the same literal number being repeated 4x per button.
  on-open:
    actions:
      - "variable set prop.cost_1 100"
      - "variable set prop.cost_2 500"
      - "variable set prop.cost_3 2000"
      - "variable set prop.cost_4 100"
      - "variable set prop.cost_5 500"
      - "variable set prop.cost_6 100"
      - "variable set prop.cost_7 1000"

  layout:
    - "BBBBBBBBB"
    - "B1B2B3BBB"
    - "BB4BB5BBB"
    - "BB6BB7BBB"
    - "BBBBBBBBB"
    - "BBBBZBBBB"

  components:
    B:
      type: DISPLAY
      display-item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "

    # ---------------------------------------------------------- Zombie Slayer I
    "1":
      type: DISPLAY
      states:
        in_progress:
          condition: "$quest.zombie_slayer_t1.status$ == in_progress"
          display-item:
            material: ROTTEN_FLESH
            name: "<dark_purple>Zombie Slayer I"
            lore:
              - "<gray>Kill: <yellow>$quest.zombie_slayer_t1.objective.kill.progress$<gray>/<yellow>$quest.zombie_slayer_t1.objective.kill.required$ <gray>Undead"
              - "<gray>Boss: <yellow>$quest.zombie_slayer_t1.objective.boss.progress$<gray>/<yellow>$quest.zombie_slayer_t1.objective.boss.required$"
        available:
          condition: "default"
          display-item:
            material: ROTTEN_FLESH
            name: "<dark_purple>Zombie Slayer I"
            lore:
              - "<gray>Kill <yellow>5 Undead <gray>mobs, then"
              - "<gray>defeat the <dark_purple>Revenant Horror<gray>."
              - "<gray>Cost: <gold>$prop.cost_1$ coins"
              - "<gray>Reward: <gold>250 coins"
              - "<green>Click to activate!"
          actions:
            left:
              conditions:
                - "$economy.purse$ >= $prop.cost_1$"
              actions:
                - "economy_remove $prop.cost_1$"
                - "quest_cancel zombie_slayer_t1"
                - "quest_start zombie_slayer_t1"
              fail-actions:
                - "notify <red>Not enough coins! Requires $prop.cost_1$ coins. io:actionbar"

