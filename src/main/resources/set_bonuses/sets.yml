# =====================================================================
# Armor Set Bonuses — for sets defined in items/armor_sets.yml
# =====================================================================
# Links armor pieces (carrying a `set: <id>` field) to shared stat bonuses.
# `bonuses` is a list of tiers; a tier's stats are granted once the player
# wears at least `pieces-required` pieces. Tiers are cumulative.
#
# ONLY flat-stat bonuses are expressed here. Sets whose full-set bonus is a
# non-stat mechanic (conditional auras, stacking, lightning, witherborn,
# refraction, knockback resist, peace treaty, healing, etc.) are intentionally
# omitted — see the report for the full omission list. Generic vanilla armors
# (leather/gold/chainmail/iron/diamond) have no set bonus and are omitted.
# =====================================================================

