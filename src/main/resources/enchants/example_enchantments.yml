# This file is the best place to learn the enchant schema by example — every enchant below is
# commented to explain not just WHAT it does, but WHY it's built the way it is. Read top to bottom;
# later enchants build on ideas introduced by earlier ones. See docs/modules/user/enchant.md for the
# full field reference and docs/modules/design/enchant.md for the underlying engine.
#
# Every old `logic:`/`logic-params:` Java class (module/enchant/logic/*.java) stays registered
# whether or not anything below still references it — the YAML capabilities here (`stats:`/
# `combat:`/`triggers:`/`state:`) and the legacy `logic:` Java hook are meant to coexist, not replace
# each other. Only `thorns` is deliberately left Java-only below, for a reason explained at its entry.

sharpness:
  name: "Sharpness"
  description:
    - "Increases melee damage by +5% per level."
  targets: ["SWORD"]
  conflicts: ["smite", "bane_of_arthropods"]
  etable-max-level: 5
  absolute-max-level: 7
  # `combat.modify-attack` is the tool for "change a number in the damage formula before the hit
  # lands". `damage-multiplier` is the FULL multiplicative factor, not a bonus percentage — so
  # "+5% per level" is written as 1.0 (the unchanged baseline) plus 0.05 per level, not just "0.05".
  # No `conditions:` here because this bonus always applies — see `execute` below for a gated example.
  combat:
    modify-attack:
      modifiers:
        damage-multiplier: "1.0 + (0.05 * $level$)"

growth:
  name: "Growth"
  description:
    - "Grants +10 max health per level."
  targets: ["HELMET", "CHESTPLATE", "LEGGINGS", "BOOTS"]
  conflicts: []
  etable-max-level: 3
  absolute-max-level: 5
  # `stats:` is the tool for "a flat passive bonus while this item is equipped/held" — it's re-applied
  # every time StatManager recalculates stats, so it always reflects the current level with no extra
  # bookkeeping. The key ("health") is a literal stat id, which is the one caveat of this block: a
  # server that renamed the "health" role via StatRoleRegistry would need to keep this enchant on
  # `logic: valmora:growth` instead, since that Java class resolves the role by name at runtime and
  # this literal string can't. Every other `stats:` enchant below shares this same caveat.
  stats:
    health: "10 * $level$"

execute:
  name: "Execute"
  description:
    - "Increases damage dealt by <yellow>+0.2%<gray> for each"
    - "<yellow>1%<gray> of health missing on your target."
  targets: ["SWORD"]
  conflicts: ["prosecute"]
  etable-max-level: 5
  absolute-max-level: 6
  # Unlike `sharpness`, this bonus depends on the TARGET's health, not just $level$ — so the formula
  # reaches for $target.missing_hp_percent$ (0 at full health, 100 at 1 HP). The `conditions:` list
  # is technically redundant here (the formula already multiplies out to exactly 1.0 at full health),
  # but it's included anyway as a worked example of gating a combat modifier — see `first_strike`
  # below for a case where the condition genuinely changes the outcome.
  combat:
    modify-attack:
      conditions:
        - "$target.hp_percent$ < 100"
      modifiers:
        damage-multiplier: "1.0 + (0.002 * $level$ * $target.missing_hp_percent$)"

first_strike:
  name: "First Strike"
  description:
    - "Increases damage dealt by <yellow>+25%<gray> per level"
    - "on the first <yellow>3<gray> hits on a mob."
  targets: ["SWORD"]
  conflicts: ["triple_strike"]
  etable-max-level: 4
  absolute-max-level: 5
  # This enchant needs FOUR blocks working together, each for a different job:
  #  1. `variables:` names the per-level bonus once, so `combat:` doesn't repeat the same formula.
  #  2. `state.transient` declares a per-attacker "how many of my first 3 hits have landed" counter —
  #     transient because it's pure in-combat bookkeeping, not something that should ever be saved
  #     to the item or survive a server restart.
  #  3. `combat.modify-attack` reads that counter's CURRENT value in its `conditions:` — this runs
  #     BEFORE the trigger below increments it, so the check is "have I already used up my first 3
  #     hits", not "will this be within my first 3 hits after this one".
  #  4. `triggers.ON_ATTACK_POST` is what actually increments the counter, once per landed hit.
  # reset-on-target-switch: true means swapping targets restarts your combo against the new one —
  # deliberately different from the old Java version, which is exactly the point: see `lethality`
  # below for the concrete bug this state.transient design fixes.
  variables:
    bonus_multiplier: "1.0 + (0.25 * $level$)"
  combat:
    modify-attack:
      conditions:
        - "$enchant.state.combo_counter$ < 3"
      modifiers:
        damage-multiplier: "$calc.bonus_multiplier$"
  triggers:
    ON_ATTACK_POST:
      actions:
        - "enchant_state increment combo_counter"
  state:
    transient:
      combo_counter:
        type: HIT_COUNTER
        reset-after-seconds: 10       # combo forgotten after 10s without a hit
        reset-on-target-switch: true  # combo also forgotten if you switch targets
        max-stacks: 3                 # never counts past 3 — matches "first 3 hits"

life_steal:
  name: "Life Steal"
  description:
    - "Heals for <red>+0.5%<gray> of your max health each"
    - "time you hit a mob."
  targets: ["SWORD"]
  conflicts: ["syphon", "mana_steal"]
  etable-max-level: 3
  absolute-max-level: 5
  # `triggers:` is the tool for "DO something after a hit lands", as opposed to `combat:`'s "CHANGE
  # a number before the hit lands". Its `actions:` list is the exact same event DSL used by GUIs,
  # abilities, and quests — `heal` here is one of the three generic events (heal/damage/
  # strike_lightning) added specifically so enchant triggers had something to call.
  # $hit.damage$ is only meaningful inside ON_ATTACK_POST/ON_DEFEND_POST — it's the just-computed
  # damage of the hit that triggered this dispatch, used here to skip healing on a 0-damage/immune hit.
  variables:
    heal_percent: "0.5 * $level$"
  triggers:
    ON_ATTACK_POST:
      conditions:
        - "$hit.damage$ > 0"
      actions:
        - "heal @self $player.max_hp$ * $calc.heal_percent$ / 100"

lethality:
  name: "Lethality"
  description:
    - "Reduces the armor of the target by <yellow>+0.2%<gray>"
    - "per level each time you hit them."
    - "Stacks up to <yellow>4<gray> times for <yellow>4<gray> seconds."
  targets: ["SWORD"]
  conflicts: []
  etable-max-level: 6
  absolute-max-level: 6
  # THE BUG THIS ENCHANT'S DESIGN FIXES: before the enchant overhaul, this stacking debuff was
  # tracked in one Java map keyed only by the VICTIM's UUID — meaning if two different players both
  # had Lethality and both hit the same mob, they shared (and could steal/reset) each other's stack
  # count. `state.transient` is keyed per-ATTACKER instead, so your own stacks are always yours alone,
  # no matter who else is also hitting the same target.
  # Read order matters here too, same as `first_strike`: combat.modify-attack applies the shred using
  # whatever stack count already exists BEFORE this hit, then ON_ATTACK_POST increments it — so a
  # fresh Lethality hit (0 existing stacks) contributes no shred of its own; the first hit only
  # starts building toward the second hit's bonus.
  variables:
    shred_per_stack: "0.2 * $level$"
  combat:
    modify-attack:
      modifiers:
        defense-shred-percent: "$calc.shred_per_stack$ * $enchant.state.stacks$"
  triggers:
    ON_ATTACK_POST:
      actions:
        - "enchant_state increment stacks"
  state:
    transient:
      stacks:
        type: HIT_COUNTER
        reset-after-seconds: 4        # a stack expires 4s after your last hit on this target
        reset-on-target-switch: true  # stacks don't carry over onto a different victim
        max-stacks: 4

protection:
  name: "Protection"
  description:
    - "Grants <green>+4 Defense<gray> per level."
  targets: ["HELMET", "CHESTPLATE", "LEGGINGS", "BOOTS"]
  conflicts: ["blast_protection", "fire_protection", "projectile_protection"]
  etable-max-level: 4
  absolute-max-level: 6
  # Same shape as `growth` — see its comment for why `stats:` is the right tool here and the
  # role-id caveat that comes with it.
  stats:
    defense: "4 * $level$"

respite:
  name: "Respite"
  description:
    - "Increases your natural regeneration"
    - "by <red>+0.5<gray> per level while out of combat."
  targets: ["HELMET", "CHESTPLATE", "LEGGINGS", "BOOTS"]
  conflicts: ["rejuvenate"]
  etable-max-level: 5
  absolute-max-level: 5
  # `stats:` formulas aren't limited to flat multiplication — this one uses a ternary
  # (condition ? value-if-true : value-if-false) to make the bonus conditional on
  # $player.in_combat$, so the regen boost only applies while you're NOT fighting. That variable
  # didn't exist before this enchant needed it; adding one new, reusable script variable was enough
  # to express an entire enchant declaratively that previously required its own Java class.
  stats:
    health_regen: "$player.in_combat$ ? 0 : (0.5 * $level$)"

thorns:
  name: "Thorns"
  # DELIBERATELY left on `logic:` — not yet migrated, and not a good migration target. The
  # ThornsLogic Java class reflects damage by directly subtracting from the attacker's health
  # instead of routing back through the normal damage pipeline. That's on purpose: if it went
  # through the pipeline (the way the new `damage` trigger event does), the attacker's OWN armor
  # would see itself take a hit and fire ITS OWN ON_DEFEND_POST trigger — which, if that armor also
  # has Thorns, immediately reflects again, which triggers again, forever. Don't migrate an
  # armor-reflect enchant to `triggers.ON_DEFEND_POST` + `damage` without solving that recursion
  # first (a one-shot "already reflecting" guard would do it, but wasn't worth adding for one enchant).
  logic: "valmora:thorns"
  description:
    - "Attacks that hit you have a <yellow>15%<gray> chance"
    - "to deal <red>1<gray> damage back to the attacker."
  targets: ["HELMET", "CHESTPLATE", "LEGGINGS", "BOOTS"]
  conflicts: []
  etable-max-level: 3
  absolute-max-level: 4

fortune:
  name: "Fortune"
  description:
    - "Increases your <gold>Mining Fortune<gray> by <gold>+10<gray> per level,"
    - "multiplying resource block drop quantities."
  targets: ["PICKAXE", "AXE", "SHOVEL", "HOE", "FISHING_ROD"]
  conflicts: []
  etable-max-level: 3
  absolute-max-level: 5
  # Same shape as `growth` — see its comment.
  stats:
    mining_fortune: "10 * $level$"

efficiency:
  name: "Efficiency"
  description:
    - "Increases your <white>Mining Speed<gray> by <white>+50<gray> per level."
  targets: ["PICKAXE", "AXE", "SHOVEL", "HOE"]
  conflicts: []
  etable-max-level: 5
  absolute-max-level: 7
  # Same shape as `growth` — see its comment.
  stats:
    mining_speed: "50 * $level$"
