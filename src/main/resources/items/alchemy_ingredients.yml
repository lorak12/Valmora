# Tier-2 and Tier-3 brewing ingredients for all potions, plus the
# level/duration/splash modifiers referenced in alchemy/modifiers.yml.
#
# Tier structure: ingredient at level 1 = vanilla item (no entry needed);
#                 level 3 = "enchanted" variant; level 5 = elite variant.
# =====================================================================

