# =====================================================================
# Skyblock-style items — FOUNDATION ROUND
# =====================================================================
# Syntax notes (differs from the original proposal draft):
#   * Variables use the engine syntax  $namespace.path$  (NOT %var%).
#   * Damage type PHYSICAL is mapped to the combat engine's MELEE type.
#   * Mechanic params may be a number OR a formula string, e.g.
#       damage: "$player.last_damage$ * 1.5"
#       heal:   "144 + ($player.max_hp$ * 0.05)"
#     Supported math functions: floor, ceil, round, abs, sqrt, min, max,
#     log10, log, pow. Logical operators: and/&&, or/||.
#   * Target selectors: @player/@self, @target,
#       @enemies_in_radius{r=X}, @allies_in_radius{r=X}, @cone{range=X, angle=Y}
#
# Registered mechanic types this round:
#   DAMAGE, HEAL, APPLY_EFFECT, MODIFY_STAT, TELEPORT,
#   PUSH_ENTITIES, PULL_ENTITIES, SCRIPT
#
# DEFERRED to a later phase (do NOT use as active YAML — the loader rejects
# unknown mechanic types): LAUNCH_PROJECTILE / projectile on-land/on-impact
# callbacks, LAUNCH_PLAYER, BEAM, returning Bonemerang, EXPLODE, ADD_STACK,
# GIVE_COINS / TAKE_COINS, CANCEL_TRAMPLE, CHARGE_JUMP, and the whole
# set-bonuses parser. Items relying solely on those are kept below as commented
# stubs. Damage/heal "ticks"/"interval" (damage-over-time) are accepted but
# currently apply a single burst.
# =====================================================================


# =====================================================================
# SWORDS & MELEE WEAPONS
# =====================================================================

rogue_sword:
  name: "Rogue Sword"
  material: "GOLDEN_SWORD"
  rarity: "COMMON"
  item-type: "SWORD"
  stats:
    DAMAGE: 20
  abilities:
    speed_boost:
      name: "Speed Boost"
      trigger: "RIGHT_CLICK"
      cooldown: 5.0
      mana-cost: 50.0
      description:
        - "<gray>Grants <white>+100 Speed <gray>for 30s."
      mechanics:
        - type: "MODIFY_STAT"
          params:
            stat: "SPEED"
            amount: 100.0
            duration: 30.0
            target: "@player"

fancy_sword:
  name: "Fancy Sword"
  material: "GOLDEN_SWORD"
  rarity: "COMMON"
  item-type: "SWORD"
  stats:
    DAMAGE: 20
  abilities:
    bejeweled_blade:
      name: "Bejeweled Blade"
      trigger: "ON_HIT"
      description:
        - "<gray>Deal <green>+150% Damage <gray>to mobs"
        - "<gray>on Mining Islands."
      # NOTE: $player.world_type$ has no provider yet, so this proc stays inert
      # until a zone/world-type variable is added (later phase).
      conditions:
        - "$player.world_type$ == \"MINING_ISLAND\""
      mechanics:
        - type: "DAMAGE"
          params:
            damage: "$player.last_damage$ * 1.5"
            damage-type: "PHYSICAL"
            target: "@target"

cleaver:
  name: "Cleaver"
