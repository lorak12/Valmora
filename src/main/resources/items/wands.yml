# ---------------------------------------------------------------------
# FIRE STAFFS (from the sword section — read like wands)
# ---------------------------------------------------------------------

fire_freeze_staff:
  name: "Fire Freeze Staff"
  material: "BLAZE_ROD"
  rarity: "EPIC"
  item-type: "NONE"
  stats:
    DAMAGE: 50
    STRENGTH: 20
  abilities:
    fire_freeze:
      name: "Fire Freeze"
      trigger: "RIGHT_CLICK"
      cooldown: 10.0
      mana-cost: 500.0
      description:
        - "<gray>Creates a circle with a radius of 5 blocks."
        - "<gray>After 5s, all mobs inside are <aqua>frozen <gray>for 10s."
      # DESCRIPTION-ONLY: the delayed-circle freeze (spawn a zone, wait 5s,
      # then freeze everything inside) has no matching mechanic — there is no
      # delayed/zoned APPLY_EFFECT. Left as flavor text until supported.

fire_fury_staff:
  name: "Fire Fury Staff"
  material: "BLAZE_ROD"
  rarity: "EPIC"
  item-type: "NONE"
  stats:
    DAMAGE: 100
    MANA: 300
  abilities:
    firestorm:
      name: "Firestorm"
      trigger: "RIGHT_CLICK"
      cooldown: 20.0
      mana-cost: 1000.0
      description:
        - "<gray>Conjure a firestorm dealing up to"
        - "<red>4,200 Magic Damage/s <gray>for 10s to mobs"
        - "<gray>within 10 blocks, igniting them."
      # NOTE: the source fires an impact projectile that spawns the firestorm.
      # LAUNCH_PROJECTILE on-hit firestorm is approximated here as a self-cast
      # radius damage-over-time (42,000 total over 10s) plus ignite.
      mechanics:
        - type: "DAMAGE"
          params:
            damage: 4200.0
            damage-type: "MAGIC"
            target: "@enemies_in_radius{r=10}"
            ticks: 10
            interval: 1.0
        - type: "IGNITE"
          params:
            duration: 10.0
            target: "@enemies_in_radius{r=10}"
