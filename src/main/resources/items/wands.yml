# =====================================================================
# WANDS & DAMAGE/SUPPORT STAFFS
# =====================================================================
# Ported from docs/ABILITIES_DUMP.md (fire staffs ~226-241, wand lists
# ~484-503). Variables use $namespace.path$ syntax. Damage-over-time is
# expressed via ticks + interval on DAMAGE/HEAL mechanics.
#
# ALREADY DONE elsewhere (skipped): wand_of_atonement, gyrokinetic_wand,
# fire_veil_wand, aurora_staff, midas_staff.
#
# Description-only abilities (no implementable mechanic — delayed-circle
# freeze / impact-firestorm projectile / rune-swap): fire_freeze_staff,
# fire_fury_staff (firestorm cast is approximated with a radius DoT, but
# the "swap rune" style mechanics are notes only where relevant).
# =====================================================================


# ---------------------------------------------------------------------
# SUPPORT WANDS
# ---------------------------------------------------------------------

wand_of_healing:
  name: "Wand Of Healing"
  material: "BLAZE_ROD"
  rarity: "UNCOMMON"
  item-type: "NONE"
  stats:
    MANA: 50
  abilities:
    healing:
      name: "Healing"
      trigger: "RIGHT_CLICK"
      cooldown: 1.0
      mana-cost: 60.0
      description:
        - "<gray>Heal yourself for <green>40 HP/s <gray>for 5s."
      mechanics:
        - type: "HEAL"
          params:
            heal: 40.0
            target: "@player"
            ticks: 5
            interval: 1.0

