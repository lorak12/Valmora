# =====================================================================
# Slayer Weapons
# =====================================================================
# Obtained from various Slayer bosses and crafting.
#
# Implementation notes:
#   * Entity-type damage bonuses use ON_HIT + conditions + DAMAGE mechanic.
#   * Abilities needing unimplemented mechanics are DESCRIPTION-ONLY:
#     - Soul collection/summoning (Reaper Scythe)
#     - Kill-counter stacking buffs (Recluse Fang)
#     - Ticker/charge state machines (Scorpion Foil: Heartstopper)
#     - HP-scaled conditional stat bonuses (Shaman Sword, Pooch Sword)
#     - Next-hit buffs (Edible Mace)
#     - Attunement toggle + delayed secondary effect (all Blaze daggers)
#       → Blaze daggers are the best candidates for a custom addon API
#         example once per-item state tracking is in place.
#     - Zap-line + warp-back mechanic (Sinseeker Scythe)
# =====================================================================


# ─────────────────────────────────────────
# Zombie Slayer
# ─────────────────────────────────────────

revenant_falchion:
  name: "Revenant Falchion"
  material: "IRON_SWORD"
  rarity: "RARE"
  item-type: "SWORD"
  stats:
    DAMAGE: 90
    STRENGTH: 50
    MANA: 100
  abilities:
    zombie_bane:
      name: "Zombie Bane"
      trigger: "ON_HIT"
      description:
        - "<gray>Deal <green>+150% damage <gray>to Zombies."
      conditions:
        - "$target.type$ == \"ZOMBIE\""
      mechanics:
        - type: "DAMAGE"
          params:
            damage: "$player.last_damage$ * 1.5"
            damage-type: "PHYSICAL"
            target: "@target"

