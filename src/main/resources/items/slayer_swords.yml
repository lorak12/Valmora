# ─────────────────────────────────────────
# Blaze Slayer — Attunement Daggers
#
# All six daggers use a two-mode attunement toggle (RIGHT_CLICK) and a
# delayed secondary effect that fires only when the target's Hellion
# Shield has switched attunement since the last hit. Both mechanics
# require per-player item state that the current system cannot model.
#
# These items are strong candidates for the first custom addon API
# example once per-item persistent state is supported — the attunement
# toggle is a clean, self-contained state machine with a well-defined
# API surface.
# ─────────────────────────────────────────

firedust_dagger:
  name: "Firedust Dagger"
  material: "IRON_SWORD"
  rarity: "RARE"
  item-type: "SWORD"
  stats:
    DAMAGE: 90
    STRENGTH: 45
    CRIT_DAMAGE: 15
  abilities:
    attunement:
      name: "Attunement"
      trigger: "RIGHT_CLICK"
      description:
        - "<gray>Swap between <red>Ashen <gray>and <gold>Auric <gray>mode"
        - "<gray>to attack through Hellion Shields."
        - "<gray>Attuned: <red>Ashen"
        - "<gray>Deal <green>1.2x damage <gray>to Blazes."
        - "<gray>Deal <green>1.1x damage <gray>to Pigmen."
      # DESCRIPTION-ONLY: attunement state toggle not implemented.
    burning_vengeance:
      name: "Burning Vengeance"
      trigger: "ON_HIT"
      description:
        - "<gray>On hit, repeat dealt damage after 6s"
        - "<gray>if the Hellion Shield has switched attunement."
      # DESCRIPTION-ONLY: shield-state delayed repeat not implemented.

