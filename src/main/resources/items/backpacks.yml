# =====================================================================
# Backpack tier progression — right-click to open, each tier adds 9
# storage slots (9 → 45). Contents live on the physical item itself
# (STORAGE component, owner: ITEM) and survive trades/drops/restarts.
# =====================================================================

backpack_tier1:
  name: "<gold>Woven Backpack"
  material: LEATHER_HORSE_ARMOR
  rarity: COMMON
  item-type: BACKPACK
  container-gui: backpack_tier1
  lore:
    - "<gray>A simple 9-slot pack."
    - "<gray>Right-click to open."
  abilities:
    open:
      trigger: RIGHT_CLICK
      mechanics:
        - type: OPEN_CONTAINER_GUI

