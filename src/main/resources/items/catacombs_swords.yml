# =====================================================================
# Catacombs Weapons
# =====================================================================
# Obtained from Catacombs floors, mob drops, and shop purchases.
#
# Implementation notes:
#   * Cleave uses ON_HIT + DAMAGE @enemies_in_radius (50% splash).
#   * Ice Spray uses DAMAGE + APPLY_EFFECT on @cone.
#   * Arc attacks (Bone Reaver, Felthorn Reaper) use @cone{angle=180}.
#   * Necron's blade family shares the wither_bane ON_HIT pattern;
#     Hyperion also gets a full Wither Impact RIGHT_CLICK (the most
#     common end-state when all three scrolls are applied).
#   * Abilities needing unimplemented mechanics are DESCRIPTION-ONLY:
#     - Soul summon (Necromancer Sword)
#     - Kill-counter stacking (Zombie Commander Whip, Fel Sword)
#     - Set bonus detection (Zombie Knight Sword)
#     - Dungeon class adaptation (Adaptive Blade, Earth Shard, Conjuring)
#     - Ricocheting/guided projectiles (Flower Of Truth, Bouquet Of Lies,
#       Spirit Sceptre)
#     - Missing-HP / target-HP ability scaling (Bone Reaver, Felthorn,
#       Spirit Sword, Bouquet Of Lies)
#     - Deactivatable immunity shield (Wither Cloak Sword)
#     - Returning dagger + backstab (Livid Dagger)
#     - Charge systems (Bone Reaver, Felthorn Reaper)
#     - Ghost-mode ability (Spirit Sword)
#     - Multi-enemy sequential teleport (Shadow Fury — roots enemies
#       in radius as a functional approximation)
# =====================================================================


