# =====================================================================
# ARMOR SETS — ported from docs/ABILITIES_DUMP.md (armor sections)
# =====================================================================
# Each full set = 4 pieces (helmet / chestplate / leggings / boots).
# The dump lists FULL-SET totals; stats are split across pieces:
#   chestplate ~30%, leggings ~27%, helmet ~24%, boots ~19% (rounded).
# Stats not in the supported list (Heat Resistance, Mining Spread,
# Pest Chance, Respiration, Block/Treasure/Pressure Fortune, Mending,
# Fear, Soulflow) are omitted.
#
# SKIPPED (already authored in new_items.yml / set_bonuses/armor_sets.yml):
#   farm_suit, young_dragon, mastiff, crimson, shadow_assassin
# =====================================================================


