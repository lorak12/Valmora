# --- Slayer bows ------------------------------------------------------

spider_shortbow:
  name: "Spider Shortbow"
  material: "BOW"
  rarity: "EPIC"
  item-type: "BOW"
  stats:
    DAMAGE: 110
    STRENGTH: 10
  abilities:
    stinger:
      name: "Stinger"
      trigger: "ON_HIT"
      mana-cost: 150.0
      description:
        - "<gray>Fully charged shots while sneaking slow the"
        - "<gray>victim and deal <red>35x your Strength <gray>as"
        - "<gray>damage per second for 6s."
      # NOTE: 6s DoT modelled as single burst (ticks/interval applies one burst).
      mechanics:
        - type: "DAMAGE"
          params:
            damage: "$player.stat.strength$ * 35"
            damage-type: "PHYSICAL"
            target: "@target"
        - type: "APPLY_EFFECT"
          params:
            effect: "slowness"
            duration: 6.0
            amplifier: 2
            target: "@target"

mosquito_shortbow:
  name: "Mosquito Shortbow"
  material: "BOW"
  rarity: "LEGENDARY"
  item-type: "BOW"
  stats:
    DAMAGE: 251
    STRENGTH: 151
    CRIT_DAMAGE: 39
    VITALITY: 20
  abilities:
    nasty_bite:
      name: "Nasty Bite"
      trigger: "ON_HIT"
      # DESCRIPTION-ONLY: %-of-max-mana cost, +%-damage and heal-for-2x-mana-cost
      # have no implemented mechanic combination.
      description:
        - "<gray>Fully charged shots while sneaking cost 11%"
        - "<gray>of max mana, deal <green>+19% damage<gray>, and"
        - "<gray>heal for 2x the mana cost."


