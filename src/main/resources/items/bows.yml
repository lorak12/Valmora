# =====================================================================
# BOWS & SHORTBOWS  — ported from docs/ABILITIES_DUMP.md
# =====================================================================
# Conventions follow items/new_items.yml:
#   * Variables use $namespace.path$ syntax.
#   * Base item stats are plain numbers (dungeon "low-high" ranges use LOW).
#   * Only implemented mechanics are authored as active blocks. Effects with no
#     implemented mechanic (homing/piercing/extra arrows, arrow-bounce, marks,
#     venom DoT-on-arrow, returning physics, missing-HP scaling) are written as
#     DESCRIPTION-ONLY abilities (name + trigger + description, no mechanics).
#   * Already-done items SKIPPED: artisanal_shortbow, ender_bow, explosive_bow,
#     runaans_bow, juju_shortbow, terminator, bonemerang.
# =====================================================================


# --- Plain bows: stats only, no abilities -----------------------------

bow:
  name: "Bow"
  material: "BOW"
  rarity: "COMMON"
  item-type: "BOW"
  stats:
    DAMAGE: 30

decent_bow:
  name: "Decent Bow"
  material: "BOW"
  rarity: "UNCOMMON"
  item-type: "BOW"
  stats:
    DAMAGE: 45


# --- Conditional / passive bonus bows ---------------------------------

wither_bow:
  name: "Wither Bow"
  material: "BOW"
  rarity: "UNCOMMON"
  item-type: "BOW"
  stats:
    DAMAGE: 30
  abilities:
    wither_bane:
      name: "Wither Bane"
      trigger: "ON_HIT"
      description:
        - "<gray>Deals <green>+100% damage <gray>to Withers"
        - "<gray>and Wither Skeletons."
      conditions:
        - "$target.type$ == \"WITHER\" or $target.type$ == \"WITHER_SKELETON\""
      mechanics:
        - type: "DAMAGE"
          params:
            damage: "$player.last_damage$ * 1.0"
            damage-type: "PHYSICAL"
            target: "@target"

