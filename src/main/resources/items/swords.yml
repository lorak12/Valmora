# =====================================================================
# Swords & Melee Weapons — ported from docs/ABILITIES_DUMP.md
# =====================================================================
# Items already defined in items/new_items.yml are intentionally skipped:
#   rogue_sword, fancy_sword, cleaver, undead_sword, raider_axe,
#   golem_sword, aspect_of_the_end, aspect_of_the_dragons,
#   ornate_zombie_sword, emerald_blade, leaping_sword, pigman_sword,
#   aurora_staff, midas_staff, glacial_scythe.
#
# Rules followed:
#   * Base `stats:` are plain numbers only; formulas live in mechanic params.
#   * SPECIAL -> LEGENDARY; RARE-EPIC ranges -> EPIC.
#   * Abilities needing unimplemented mechanics (summon, consume-item,
#     channel, returning projectile, beam, stacking buffs, "instead of
#     dying", pet-copy, etc.) are authored DESCRIPTION-ONLY (no mechanics).
# =====================================================================


