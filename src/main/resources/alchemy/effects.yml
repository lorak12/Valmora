# =====================================================================
# Valmora Alchemy Effects
#
# max-level: absolute maximum including all level modifiers
# tiers: ingredient → base level produced (ingredient can be a vanilla
#         material name or a custom Valmora item ID)
#         "if the ingredients state multiple items they are levels 1,3,5"
# duration: base durations in seconds per level [1..max-level]
# stats: per-stat list of values per level [1..max-level]
# =====================================================================

