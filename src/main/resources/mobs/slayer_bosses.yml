# Boss mobs for the quests/slayers package (resources/quests/slayers/quests.yml).
# Each tier's "kill" objective spawns its own boss id on completion; the "boss" objective
# then requires killing that exact mob. Stats scale up per tier within a chain.

# ---------------------------------------------------------------- Zombie Slayer bosses
zombie_slayer_boss_1:
  category: BOSS
  type: ZOMBIE
  name: "<dark_purple>Revenant Horror</dark_purple>"
  level: 10
  damage-type: MELEE
  base-xp: 50
  gold-reward: 50
  stats:
    health: 800
    damage: 40
    defense: 20
    speed: 0.28
  glowing: true
  boss-bar:
    enabled: true
    color: PURPLE
    style: SOLID
    range: 30

zombie_slayer_boss_2:
  category: BOSS
  type: ZOMBIE
  name: "<dark_purple>Revenant Horror <gray>II</dark_purple>"
  level: 25
  damage-type: MELEE
  base-xp: 150
  gold-reward: 150
  stats:
    health: 3000
    damage: 90
    defense: 60
    speed: 0.3
  glowing: true
  boss-bar:
    enabled: true
    color: PURPLE
    style: SEGMENTED_6
    range: 30

zombie_slayer_boss_3:
  category: BOSS
  type: ZOMBIE_VILLAGER
  name: "<dark_purple>Revenant Horror <gray>III</dark_purple>"
  level: 45
  damage-type: MELEE
  base-xp: 400
  gold-reward: 400
  stats:
    health: 9000
    damage: 160
    defense: 120
    speed: 0.32
  glowing: true
  boss-bar:
    enabled: true
    color: PURPLE
    style: SEGMENTED_10
    range: 40
  abilities:
    plague-nova:
      name: "Plague Nova"
      trigger: ON_TIMER
      interval: 140
      chance: 0.5
      cooldown: 7.0
      target-range: 10
      announce: "<dark_purple>The Revenant Horror unleashes a wave of decay!"
      mechanics:
        - type: DAMAGE
          params:
            amount: 120
            type: POISON
            target: "@target"
        - type: APPLY_EFFECT
          params:
            effect: poison
            duration: 4
            amplifier: 1
            target: "@target"
    raise-dead:
      name: "Raise the Dead"
      trigger: ON_HEALTH
      health-percent: 40
      announce: "<dark_purple>The Revenant Horror calls forth the dead!"
      mechanics:
        - type: SCRIPT
          params:
            events:
              - "spawn_mob revenant_thrall 2 radius:5"

# Minion summoned by the Revenant Horror III's "Raise the Dead" ability. Not a quest-tracked
# boss mob (see zombie_slayer_boss_* above) — just a reskinned trash zombie.
revenant_thrall:
  category: UNDEAD
  type: ZOMBIE
  name: "<dark_purple>Revenant Thrall</dark_purple>"
  level: 40
  damage-type: MELEE
  base-xp: 15
  gold-reward: 5
  stats:
    health: 400
    damage: 60
    defense: 40
    speed: 0.32

