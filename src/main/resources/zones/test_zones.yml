mine:
  display-name: <gray>Mine
  world: world
  min:
    - -100
    - 131
    - -100
  max:
    - -79
    - 153
    - -89
  allow:
    pvp: false
    natural-mob-spawning: false
    block-breaking: false
    block-placing: false
    hunger: false
    entry: true
    teleportation: true
    leaf-decay: false
  resource-blocks:
    # --- Normal stone ores (→ COBBLESTONE → BEDROCK) ---
    COAL_ORE:
      regen-delay: 200
      stages:
        - drops:
            - item: COAL
              min: 1
              max: 1
              chance: 1.0
          next: COBBLESTONE
        - drops:
            - item: COBBLESTONE
              min: 1
              max: 1
              chance: 1.0
          next: BEDROCK
