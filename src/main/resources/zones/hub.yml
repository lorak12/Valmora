hub:
  display-name: "<gold>Hub"
  world: world
  min: [-200, 50, -200]
  max: [200, 255, 200]
  # All flags default to false — only add an 'allow' block when you need to enable something

coal_mine:
  display-name: "<gray>Coal Mine"
  world: world
  min: [-80, 50, 60]
  max: [-30, 100, 120]
  resource-blocks:
    COAL_ORE:
      regen-delay: 300
      stages:
        - drops:
            - item: COAL
              min: 1
              max: 3
              chance: 1.0
          next: COBBLESTONE
        - drops:
            - item: COBBLESTONE
              min: 1
              max: 2
              chance: 0.5
          next: BEDROCK
    STONE:
      regen-delay: 120
      stages:
        - drops:
            - item: COBBLESTONE
              min: 1
              max: 1
              chance: 1.0
          next: COBBLESTONE
        - drops: []
          next: BEDROCK

forest:
  display-name: "<green>Whispering Forest"
  world: world
  min: [30, 50, -150]
  max: [150, 120, -30]
  resource-blocks:
    OAK_LOG:
      regen-delay: 600
      stages:
        - drops:
            - item: OAK_LOG
              min: 1
              max: 3
              chance: 1.0
          next: BEDROCK

fishing_village:
  display-name: "<aqua>Fishing Village"
  world: world
  fishing-loot-table: hub_fishing
  min: [100, 50, 100]
  max: [200, 100, 200]

graveyard:
  display-name: "<dark_gray>Graveyard"
  world: world
  min: [-150, 50, -150]
  max: [-80, 100, -60]
  mob-spawners:
    zombie_1:
      mob: test_zombie
      x: -115
      y: 64
      z: -105
      spawn-interval: 300
      max-alive: 3
      radius: 25.0
    skeleton_1:
      mob: test_skeleton
      x: -120
      y: 64
      z: -110
      spawn-interval: 400
      max-alive: 2
      radius: 25.0
