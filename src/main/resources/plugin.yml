name: Valmora
version: "0.1"
main: org.nakii.valmora.Valmora
api-version: "1.21"
authors: [nakii]
depend: [packetevents]
description: A MMORPG engine for creating anything one can imagine.

commands:
  profile:
    usage: /profile help
  stat:
    usage: /stat help
  item:
    usage: /item help
    permission: valmora.admin
    description: Give custom Valmora items. Admin only.
  mob:
    usage: /mob help
    permission: valmora.admin
    description: Spawn and manage custom mobs. Admin only.
  skill:
    usage: /skill help
    description: Master command for skills interactions.
  gui:
    usage: /gui help
    permission: valmora.admin.gui
    description: Gui debugging and opening commands.
  time:
    usage: /time [info|reset]
    description: Display or reset the Valmora RPG calendar clock.
  potion:
    usage: /potion give <effect_id> <level> [player]
    permission: valmora.admin
    description: Give an alchemy potion to a player.
  effects:
    usage: /effects
    description: Open the active effects GUI.
  eco:
    usage: /eco <get|set|add|remove> <player> [purse|bank] [amount]
    permission: valmora.admin
    description: Admin command for manipulating player coin balances.
  warp:
    usage: /warp [id]
    description: Teleport to a warp point or open the fast travel menu.
  zone:
    usage: /zone <create|delete|info|list|wand|pos1|pos2|clear|flag|spawner|visualize>
    permission: valmora.admin
    description: Zone management command.
  quest:
    usage: /quest [journal]
    description: Open the quest journal or manage quests.
  npc:
    usage: /npc <create|delete|list|reload>
    permission: valmora.admin
    description: NPC management command.
  valmora:
    usage: /valmora reload
    permission: valmora.admin
    description: Master engine administrative command.
  collections:
    usage: /collections
    description: Open the collections menu.
  accessories:
    usage: /accessories
    description: Open your accessory bag.
