# Mob pipeline — every step of a boss ability firing, and of a custom (Valmora) mob dying, in order.
# Design: docs/PIPELINE_FLOWS_PLAN.md.
#
# Each flow is a list of steps. A step is one of:
#   - builtin: <name>          a built-in step (listed below), optionally with `params:`
#   - anchor: <point>          runs the `stages:` whose `when:` matches, plus plugin hooks
#   - id: <id> + on-pass: [..] a script step (conditions / on-pass / on-fail — same DSL as everywhere)
# Every step also accepts `id:` (unique in the flow), `enabled: false` (skip it) and `conditions:`
# (skip the step when false; the flow carries on). `interrupt` in a script step stops the flow.
# Deleting a flow (or this whole file) uses the built-in default. `/valmora pipeline flows mob`
# shows what's loaded.
#
# Note: in `cast`, the caster is the boss, not a player — most player-facing events (`notify`,
# `give`, `tag`) do nothing there. $target.*$ is the ability's target (usually a player).

version: 2

flows:
  # A boss ability's trigger or timer fired.
  # Variables: $mob.ability_id$, $mob.ability_trigger$, $mob.id$, $mob.level$, $mob.health$,
  # $mob.max_health$, $mob.health_percent$, $target.*$.
  cast:
    # The ability's own cooldown. Required (boss timers rely on it).
    - builtin: cooldown_gate
    # Abilities with a target-range aim at the nearest player in range.
    - builtin: resolve_target
    # Broadcasts the ability's `announce:` text. params: radius (default: config.yml
    # mobs.boss.announce-radius, else 40)
    - builtin: announce
    # `interrupt` from a stage here cancels just this firing (e.g. a "silence" debuff) — the
    # cooldown stays spent.
    - anchor: pre_ability
    # Runs the ability's mechanics with the boss as caster. Required.
    - builtin: run_mechanics
    - anchor: post_ability

  # A custom mob died.
  # Variables: $mob.id$, $mob.level$, $mob.has_killer$, $mob.luck$, $mob.xp$, $mob.gold$ — plus
  # $player.*$ (the killer) and $target.*$ (the mob).
  # Writable with `pipeline_set <key> <value>`: mob.xp, mob.gold, mob.luck (before the step that uses them).
  death:
    # Fires the boss's ON_DEATH abilities and removes its boss bar.
    - builtin: boss_on_death
    # The killer's loot luck. params: stats (list of stat ids to add up; default: the luck stat + pet_luck)
    - builtin: resolve_luck
    # Skill XP for the killer (the mob's xp-reward). params: skill (default: config.yml
    # mobs.combat-skill-id, else combat)
    - builtin: grant_skill_xp
    # Coins for the killer (the mob's gold-reward).
    - builtin: grant_gold
    # Rolls the mob's loot table (luck raises luck-affected chances).
    - builtin: roll_loot
    # Runs combat_pipeline.yml's `when: on_death` stages — only when a player got the kill.
    - anchor: combat:on_death
      conditions:
        - "$mob.has_killer$ == true"

# Legacy format, still supported: each stage runs at the anchor matching its `when:`
# (pre_ability, post_ability). Example (disabled — remove the leading `#` on every line to enable):
#
# stages:
#   - id: block_enrage_below_10_percent
#     when: pre_ability
#     conditions:
#       - "$mob.ability_id$ == enrage"
#       - "$mob.health_percent$ <= 10"
#     on-pass:
#       - "interrupt"

stages: []
