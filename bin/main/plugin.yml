name: Valmora
version: "0.1"
main: org.nakii.valmora.Valmora
api-version: "1.21"
authors: [nakii]
description: A MMORPG engine for creating anything one can imagine.

commands:
  profile:
    usage: /profile help
  stat:
    usage: /stat help
  item:
    usage: /item help
  mob:
    usage: /mob help
  skill:
    usage: /skill help
    description: Master command for skills interactions.
  gui:
    usage: /gui help
    description: Gui debugging and opening commands.
  time:
    usage: /time [info|reset]
    description: Display or reset the Valmora RPG calendar clock.
  potion:
    usage: /potion give <effect_id> <level> [player]
    permission: valmora.admin
    description: Give an alchemy potion to a player.
  effects:
    usage: /effects
    description: Open the active effects GUI.
  eco:
    usage: /eco <get|set|add|remove> <player> [purse|bank] [amount]
    permission: valmora.admin
    description: Admin command for manipulating player coin balances.
  warp:
    usage: /warp [id]
    description: Teleport to a warp point or open the fast travel menu.
  valmora:
    usage: /valmora reload
    permission: valmora.admin
    description: Master engine administrative command.
